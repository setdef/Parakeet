group = com.setdef.parakeet
version = 0.15.0

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true

# No file-system watching: on a busy machine it missed changes (a new file, and sources changed by `git apply`),
# and the build then ran tests on stale code (SESSION-0.13.1-and-stale-answers.md). Gradle checks the files instead.
org.gradle.vfs.watch = false
