# Releases a version when its tag (e.g. v0.4.0, matching `version` in
# gradle.properties) is pushed: runs the full build, then signs the plugin and
# creates a GitHub Release with the signed zip and updatePlugins.xml (the
# custom plugin repository file IDEs check for updates). Publishes to the
# JetBrains Marketplace too, if PUBLISH_TOKEN is set.
#
# Repository secrets (see README.md, "Releasing"):
#   CERTIFICATE_CHAIN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD  (plugin signing; required)
#   PUBLISH_TOKEN                                         (Marketplace; optional)
name: Release

on:
  push:
    tags: ['v*']

# One release at a time, each waiting its turn rather than being cancelled.
# (The "-caller" part keeps this group distinct from build.yml's, which it calls.)
concurrency:
  group: ${{ github.workflow }}-caller
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

# "shell: bash" runs with -eo pipefail.
defaults:
  run:
    shell: bash

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    name: Publish ${{ github.ref_name }}
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No caches when building what gets published, so a poisoned cache can't reach users.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          cache: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true
      - name: Check secrets and version
        run: |
          for secret in CERTIFICATE_CHAIN PRIVATE_KEY PRIVATE_KEY_PASSWORD; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::The $secret secret isn't set; see README.md, \"Releasing\"."
              exit 1
            fi
          done
          version="$(grep '^version' gradle.properties | cut -d= -f2 | tr -d ' ')"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in gradle.properties."
            exit 1
          fi
      - name: Sign the plugin and write updatePlugins.xml
        run: ./gradlew signPlugin updatePluginsXml
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/distributions/*-signed.zip build/distributions/updatePlugins.xml \
            --title "$GITHUB_REF_NAME" --generate-notes
      - name: Publish to the JetBrains Marketplace
        if: env.PUBLISH_TOKEN != ''
        run: ./gradlew publishPlugin
