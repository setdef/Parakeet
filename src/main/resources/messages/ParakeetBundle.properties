inlay.parameters.name=Parameter names
inlay.parameters.description=Shows parameter names before positional arguments in calls: the compiler's with Cuttlebone, and otherwise only when Parakeet knows exactly what's called.
inlay.types.name=Types
inlay.types.description=Shows the types Cuttlebone infers for let bindings and closure arguments that don't write one. Needs a Cuttlebone with inlay hints, and code that type checks.
