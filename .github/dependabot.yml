version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    # Let new releases settle (and any compromised ones get pulled) before updating.
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let new releases settle (and any compromised ones get pulled) before updating.
    cooldown:
      default-days: 7
