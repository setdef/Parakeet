# Builds the plugin, runs unit tests, checks compatibility with the Plugin
# Verifier, and runs integration tests against real Inko releases installed
# with ivm (the newest release and the oldest supported one, on Linux and
# macOS). Also called by release.yml before publishing.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# "shell: bash" runs with -eo pipefail.
defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build and run unit tests
        run: ./gradlew buildPlugin test -PunitOnly
      - name: Upload plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin
          path: build/distributions/*.zip
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports
          path: build/reports/tests

  verify:
    name: Plugin Verifier
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Only "Build and unit tests" (and one macOS job) write Gradle caches; the
          # others restore them, since setup-gradle shares cached dependencies across
          # jobs by content. Writing from every job overflowed GitHub's 10 GB cache
          # budget, evicting the small but slow-to-rebuild Inko installs.
          cache-read-only: true
      - name: Verify against the oldest and newest supported IDEs
        run: ./gradlew verifyPlugin
      - name: Upload verifier reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-verifier-reports
          path: build/reports/pluginVerifier

  integration:
    name: Integration (${{ matrix.os }}, Inko ${{ matrix.inko }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15]
        # The newest release, and the oldest one the plugin supports.
        inko: [latest, 0.20.0]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # macOS needs its own (macOS) IDE download cached, so one macOS job writes it.
          cache-read-only: ${{ !(matrix.os == 'macos-15' && matrix.inko == 'latest') }}
      - name: Resolve Inko version
        id: inko
        env:
          REQUESTED: ${{ matrix.inko }}
        run: |
          if [[ "$REQUESTED" == latest ]]; then
            version="$(curl --fail --silent --show-error https://releases.inko-lang.org/manifest.txt | sort --version-sort | tail -n 1)"
          else
            version="$REQUESTED"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Inko $version"
      - name: Find ivm's data directory
        id: ivm
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            echo "data=$HOME/Library/Application Support/ivm" >> "$GITHUB_OUTPUT"
          else
            echo "data=${XDG_DATA_HOME:-$HOME/.local/share}/ivm" >> "$GITHUB_OUTPUT"
          fi
      # Building Inko from source takes a while, so keep ivm and each installed version.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/ivm
            ${{ steps.ivm.outputs.data }}
          key: ivm-${{ matrix.os }}-inko-${{ steps.inko.outputs.version }}
      - name: Install Inko
        run: ./ci/install-inko.sh "${{ steps.inko.outputs.version }}"
      - name: Run integration tests
        run: ./gradlew test --tests '*IntegrationTest'
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-test-reports-${{ matrix.os }}-inko-${{ steps.inko.outputs.version }}
          path: build/reports/tests
